services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_DATABASE: zhe_picture
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.2-alpine
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    command:
      - /bin/sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        else
          exec redis-server --appendonly yes
        fi
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${REDIS_PASSWORD}\" ]; then redis-cli -a \"$${REDIS_PASSWORD}\" ping; else redis-cli ping; fi"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:mysql://mysql:3306/zhe_picture?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD must be set}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DATABASE: 5
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}"
      SA_TOKEN_COOKIE_SECURE: "${SA_TOKEN_COOKIE_SECURE:-false}"
      COS_SECRET_ID: "${COS_SECRET_ID:-}"
      COS_SECRET_KEY: "${COS_SECRET_KEY:-}"
      COS_REGION: "${COS_REGION:-}"
      COS_BUCKET: "${COS_BUCKET:-}"
      COS_HOST: "${COS_HOST:-}"
      ALIYUN_API_KEY: "${ALIYUN_API_KEY:-}"
    ports:
      - "8123:8123"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
