server:
  port: 8123
  # 让 Spring 正确识别 Nginx 转发的 HTTPS 和 WebSocket 请求头
  forward-headers-strategy: framework
  servlet:
    context-path: /api
sa-token:
  token-name: satoken
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-read-body: false
  is-read-header: true
  is-read-cookie: true
  is-lasting-cookie: true
  is-log: false
  cookie:
    httpOnly: true
    secure: ${SA_TOKEN_COOKIE_SECURE:true}
    sameSite: ${SA_TOKEN_COOKIE_SAMESITE:Lax}
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
cos:
  client:
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
picture:
  upload:
    max-pixels: ${PICTURE_UPLOAD_MAX_PIXELS:16000000}
    reconcile-timeout-ms: ${PICTURE_UPLOAD_RECONCILE_TIMEOUT_MS:900000}
    cos:
      max-retries: ${PICTURE_COS_UPLOAD_MAX_RETRIES:3}
    url:
      connect-timeout-ms: ${PICTURE_URL_CONNECT_TIMEOUT_MS:5000}
      read-timeout-ms: ${PICTURE_URL_READ_TIMEOUT_MS:10000}
      max-bytes: ${PICTURE_URL_MAX_BYTES:2097152}
      max-concurrency: ${PICTURE_URL_MAX_CONCURRENCY:8}
  reconcile:
    orphan-scan-enabled: ${PICTURE_ORPHAN_SCAN_ENABLED:false}
    orphan-grace-ms: ${PICTURE_ORPHAN_GRACE_MS:86400000}
    orphan-scan-delay-ms: ${PICTURE_ORPHAN_SCAN_DELAY_MS:3600000}
outbox:
  worker:
    fixed-delay-ms: ${OUTBOX_WORKER_FIXED_DELAY_MS:5000}
    batch-size: ${OUTBOX_WORKER_BATCH_SIZE:20}
    max-retries: ${OUTBOX_WORKER_MAX_RETRIES:8}
ai-task:
  recovery:
    fixed-delay-ms: ${AI_TASK_RECOVERY_FIXED_DELAY_MS:60000}
    creating-timeout-ms: ${AI_TASK_RECOVERY_CREATING_TIMEOUT_MS:900000}
aliyun:
  apiKey: ${ALIYUN_API_KEY:}
spring:
  servlet:
    multipart:
      max-file-size: 10MB
  # 空间图片分表
  shardingsphere:
    datasource:
      names: zhe_picture
      zhe_picture:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: ${DB_URL:jdbc:mysql://localhost:3306/zhe_picture}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:}
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: zhe_picture.picture # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: com.sdfkl.zhepicturebackend.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true
  application:
    name: zhe-picture-backend
  # 数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhe_picture}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    url: ${DB_URL:jdbc:mysql://localhost:3306/zhe_picture}
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    # 已有数据库首次接入 Flyway 时，先确认表结构后再临时打开并设置版本。
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${FLYWAY_BASELINE_VERSION:4}
    validate-on-migrate: true
  # Redis 配置
  redis:
    database: 5
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    timeout: 5000
  profiles:
    active: local
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    # 仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    # 全局配置
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为0）
    enable-sql-runner: true
knife4j:
  enable: true
  openapi:
    title: 折纸图片后端接口文档
    version: 1.0
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.sdfkl.zhepicturebackend.controller
