# Copy this file to src/main/resources/application-local.yml for local development.
# The copied file is ignored by Git. Keep all credentials in environment variables.
sa-token:
  cookie:
    secure: ${SA_TOKEN_COOKIE_SECURE:false}
cos:
  client:
    host: ${COS_HOST:}
    region: ${COS_REGION:}
    bucket: ${COS_BUCKET:}
    secretId: ${COS_SECRET_ID:}
    secretKey: ${COS_SECRET_KEY:}
aliyun:
  apiKey: ${ALIYUN_API_KEY:}
